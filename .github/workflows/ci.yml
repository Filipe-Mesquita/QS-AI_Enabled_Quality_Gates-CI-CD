name: AI-Enabled CI/CD Pipeline

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install -r requirements.txt

    # FIX IMPORT PATHS (APP MODULE)
    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

    # -------------------------
    # UNIT TESTS (manual run)
    # -------------------------
    - name: Run Unit Tests
      run: python tests/unit_tests/unit_testing.py

    # -------------------------
    # FUZZ TESTING
    # -------------------------
    - name: Run Fuzz Testing
      run: python -c "from tests.fuzz_tests.fuzz_testing import run_fuzz_tests; print(run_fuzz_tests())"

    # -------------------------
    # MUTATION TESTING
    # -------------------------
    - name: Run Mutation Testing
      run: python -c "from tests.mutation_tests.mutation_testing import run_mutation_tests; print(run_mutation_tests())"

    # -------------------------
    # GENERATE DATASET
    # -------------------------
    - name: Generate Dataset
      run: python generate_data.py

    # -------------------------
    # SIMULATE PIPELINE
    # -------------------------
    - name: Simulate Merges
      run: python simulate_merges.py

    # -------------------------
    # ANALYZE RESULTS
    # -------------------------
    - name: Analyze Results
      run: python analyze_results.py

    # -------------------------
    # Upload metrics
    # -------------------------
    - name: Upload metrics
      uses: actions/upload-artifact@v4
      with:
        name: metrics
        path: data/metrics.json